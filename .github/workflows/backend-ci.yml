name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Create .env.test
      run: |
        cat << EOF > .env.test
        NODE_ENV=test
        PORT=5000
        JWT_SECRET=test_jwt_secret_for_testing_only
        JWT_REFRESH_SECRET=test_jwt_refresh_secret_for_testing_only
        DATABASE_URL=postgres://testuser:testpass@localhost:5432/testdb
        POSTGRES_USER=testuser
        POSTGRES_PASSWORD=testpass
        POSTGRES_DB=testdb
        RAZORPAY_KEY_ID=test_razorpay_key_id
        RAZORPAY_KEY_SECRET=test_razorpay_key_secret
        CLOUDINARY_CLOUD_NAME=test_cloud_name
        CLOUDINARY_API_KEY=test_api_key
        CLOUDINARY_API_SECRET=test_api_secret
        SMTP_USER=test_smtp_user
        SMTP_PASS=test_smtp_pass
        EOF

    - name: Run Tests
      run: npm test

    - name: TypeScript Build Check
      run: npm run build
